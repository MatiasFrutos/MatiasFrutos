<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
  <defs>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F0FF"/><stop offset="1" stop-color="#FF2E97"/></linearGradient>
    <style>
      text{font-family:'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace;font-size:15px}
      .p{fill:#7C3AED}.c{fill:#00F0FF}.t{fill:#C9D1FF}.ok{fill:#3DFFA2}
      .l{opacity:0;animation:show 14s infinite}
      .l1{animation-delay:.2s}.l2{animation-delay:1.4s}.l3{animation-delay:2.4s}.l4{animation-delay:3.4s}.l5{animation-delay:4.4s}.l6{animation-delay:5.6s}
      @keyframes show{0%{opacity:0}2%{opacity:1}90%{opacity:1}100%{opacity:0}}
      .cur{animation:blink 1s steps(2) infinite}
      @keyframes blink{to{opacity:0}}
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="248" rx="14" fill="#07091A" stroke="url(#n)" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="34" rx="14" fill="#0E1230"/>
  <circle cx="24" cy="18" r="6" fill="#FF5F56"/><circle cx="46" cy="18" r="6" fill="#FFBD2E"/><circle cx="68" cy="18" r="6" fill="#27C93F"/>
  <text x="450" y="23" text-anchor="middle" class="t" style="font-size:12px;opacity:.6">matias@frutos: ~/boot</text>
  <g>
    <text x="24" y="66" class="l l1"><tspan class="p">❯</tspan> <tspan class="c">sudo</tspan> <tspan class="t">systemctl start matias.service</tspan></text>
    <text x="24" y="94" class="l l2"><tspan class="ok">[ OK ]</tspan> <tspan class="t">Cargando módulo</tspan> <tspan class="c">backend</tspan> <tspan class="t">(Node · Express · PostgreSQL)</tspan></text>
    <text x="24" y="122" class="l l3"><tspan class="ok">[ OK ]</tspan> <tspan class="t">Cargando módulo</tspan> <tspan class="c">desktop</tspan> <tspan class="t">(Electron · Python · C#)</tspan></text>
    <text x="24" y="150" class="l l4"><tspan class="ok">[ OK ]</tspan> <tspan class="t">Cargando módulo</tspan> <tspan class="c">ia-local</tspan> <tspan class="t">(Ollama)</tspan></text>
    <text x="24" y="178" class="l l5"><tspan class="ok">[ OK ]</tspan> <tspan class="t">Cargando módulo</tspan> <tspan class="c">hardware</tspan> <tspan class="t">(diagnóstico · soporte)</tspan></text>
    <text x="24" y="214" class="l l6"><tspan class="p">❯</tspan> <tspan class="ok">sistema listo. disponible para nuevos proyectos</tspan><tspan class="c cur"> █</tspan></text>
  </g>
</svg>
